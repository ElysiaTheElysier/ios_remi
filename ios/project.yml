name: Remi
options:
  bundleIdPrefix: vn.remi
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Remi dùng micro khi bạn bấm nói hoặc bật Hey Remi. Chế độ Hey Remi nghe trên thiết bị kể cả khi khóa màn hình; chỉ yêu cầu sau wake word được gửi để chép lời.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Remi
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Remi:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
    dependencies:
      - package: Porcupine
        product: Porcupine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.remi.experimental
  RemiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Remi
schemes:
  Remi:
    build:
      targets:
        Remi: all
        RemiTests: [test]
    test:
      targets: [RemiTests]
packages:
  Porcupine:
    url: https://github.com/Picovoice/porcupine.git
    revision: v4.0
